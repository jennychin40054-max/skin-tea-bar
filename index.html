const qs=[["洗臉後，尚未擦保養品時的感受？", ["全臉容易出油", "T 字油、兩頰偏乾", "全臉乾燥緊繃", "全臉舒適不緊繃"]], ["到了下午，臉部出油的分布？", ["全臉明顯油光", "T 字油、兩頰少油", "全臉幾乎不出油", "僅少量油光、很舒適"]], ["平常最常出現哪種肌膚困擾？", ["容易冒痘", "黑頭或白頭粉刺", "乾燥或起屑", "暗沉或痘印", "沒有明顯困擾"]], ["使用新保養品時，容易刺痛或泛紅嗎？", ["幾乎不會", "偶爾會", "經常會"]], ["遇到換季或溫差時，容易泛紅刺癢嗎？", ["幾乎不會", "偶爾會", "經常會"]], ["平常待在冷氣房時，肌膚的狀態？", ["全臉仍偏油", "T 字油、兩頰乾", "全臉容易緊繃", "整體維持舒適"]], ["目前最想優先改善什麼？", ["痘痘困擾", "粉刺困擾", "乾燥缺水", "泛紅不適", "暗沉或痘印", "維持目前膚況"]]];let pos=0,answers=[];const app=document.getElementById('app');function home(){app.innerHTML=`<p class="eyebrow">A LITTLE SKIN RECIPE</p><h1>你的肌膚是哪一杯？</h1><div class="row">${drinks.map((_,i)=>art(i)).join('')}</div><p>今天不選飲料，<br>先選出你的肌膚命定款！</p><p>找出你的膚質與專屬保養配方。</p><button onclick="start()">開始調製我的肌膚飲料 →</button><p class="muted">約 2 分鐘 · 7 道題目 · 專屬保養配方</p>`}function start(){pos=0;answers=[];question()}function question(){window.scrollTo(0,0);let q=qs[pos];app.innerHTML=`<div class="progress"><i style="width:${(pos+1)/7*100}%"></i></div><small>ORDER ${String(pos+1).padStart(2,'0')} / 7</small><div class="paper"><p class="eyebrow">${[0,1,5].includes(pos)?'選擇你的茶底':'加入你的專屬配料'}</p><h2>${q[0]}</h2><div class="choices">${q[1].map((x,i)=>`<button class="${answers[pos]===i?'sel':''}" onclick="choose(${i})">${x}</button>`).join('')}</div></div><button class="secondary" onclick="back()">← 上一步</button>`}function choose(i){answers[pos]=i;if(++pos===7)result();else question()}function back(){if(pos===0)home();else{pos--;question()}}let base,idx,tops,isSensitive=false;const info=[['爆爆珍珠','痘痘困擾','你選擇了容易冒痘或希望改善痘痘的描述。油脂、毛囊阻塞及發炎都可能參與其中。','溫和清潔，不擠痘；反覆紅腫請諮詢皮膚科。'],['黑糖粉粿','粉刺困擾','毛孔內油脂與角質堆積可能造成黑頭或白頭，但毛孔明顯不一定代表粉刺。','避免磨砂及過度清潔，先建立穩定保養。'],['去冰加水','乾燥缺水感','緊繃、乾屑或卡粉可能與角質層保水能力及環境乾燥相關；油肌也可能有乾燥感。','洗臉後適時保濕，依部位調整用量。'],['辣椒加爆','泛紅敏感傾向','刺癢、泛紅可能與刺激反應或屏障狀態有關，問卷不能判定病因。','暫停刺激性產品，先局部試用；持續不適就醫。'],['蜜桃果凍','暗沉與痘印需求','這是你主動選擇的保養目標，不代表已測得色素沉澱或老化。','日常防曬，膚況穩定後再考慮亮膚產品。']];

function toppingArt(i){let shapes=['<circle cx="30" cy="39" r="15" fill="#c68b60"/><circle cx="57" cy="27" r="13" fill="#d5a477"/><circle cx="65" cy="55" r="14" fill="#b77950"/>','<path d="M16 30q20 -15 36 0l-4 37-31 -2z M53 24q18 -8 29 8l-5 33-25 -3z" fill="#80604e"/>','<path d="M45 12Q10 53 29 67Q45 83 62 65Q77 50 45 12Z" fill="#a8c8d0"/><path d="M35 45q-9 12 0 18" fill="none" stroke="#fff"/>','<path d="M70 23Q82 55 23 72Q45 52 43 35Q44 19 70 23Z" fill="#c67d70"/><path d="M62 24q-3 -15 10 -17" fill="none" stroke="#788866"/>','<path d="M19 39q0 -20 29 -20t29 20l-5 28q-24 12 -48 0z" fill="#e3b0a2"/>'];return `<svg viewBox="0 0 96 90" aria-hidden="true"><g stroke="#756552" stroke-width="1.8" stroke-linejoin="round"><ellipse cx="48" cy="79" rx="34" ry="4" fill="#ded7c7" stroke="none"/>${shapes[i]}</g></svg>`}function productCards(ids){return [...new Set(ids)].map(i=>`<div class="product"><img src="${products[i][2]}" alt="${products[i][0]}"><div><strong>${products[i][0]}</strong><p>${products[i][1]}</p></div></div>`).join('')}
function classify(a){const map=[1,2,0,3],scores=[0,0,0,0];[0,1,5].forEach(i=>scores[map[a[i]]]++);const max=Math.max(...scores);const base=[1,0,5].map(i=>map[a[i]]).find(k=>scores[k]===max);const sensitive=a[3]+a[4]>=3;const flags=[a[2]===0||a[6]===0,a[2]===1||a[6]===1,a[2]===2||a[6]===2||base===0,sensitive||a[3]===2||a[4]===2||a[6]===3,a[2]===3||a[6]===4];// Prioritize the stated concern, then the usual concern; irritation overrides actives.
const primary=a[6]===5?([0,1,2,4,5][a[2]]):a[6];
let moisturizer=base===1?1:base===2?13:0;
let rec;
if(flags[3]){rec=[0,2];}
else if(primary===2){rec=[base===1?1:0,base===0?7:12];}
else if(primary===4){rec=[moisturizer,3];}
else if(primary===0){rec=[moisturizer,base===0?11:base===1?8:4];}
else if(primary===1){rec=[moisturizer,base===0?11:(a[3]===0&&a[4]===0?(base===1?10:5):8)];}
else {rec=[moisturizer,base===1?4:base===0?11:14];}
